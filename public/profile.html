<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- PWA Support -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0b0f17">
  <link rel="apple-touch-icon" href="/images/icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((reg) => console.log('Service Worker registered:', reg.scope))
          .catch((err) => console.error('Service Worker registration failed:', err));
      });
    }
  </script>
  <title>Profile - Build Your Link</title>
  <link rel="stylesheet" href="/css/style.css">
  <!-- FontAwesome for nice brand icons in custom links -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="profile-wrapper theme-glass-dark" id="profile-body">

  <!-- Desktop Layout Toggle Switch Widget (Hidden on actual mobile screens) -->
  <div class="layout-toggle-pill" id="layout-toggle-pill">
    <button class="toggle-btn active" id="toggle-mobile" title="Simulated Mobile Layout">
      <i class="fa-solid fa-mobile-screen-button"></i> <span>Mobile View</span>
    </button>
    <button class="toggle-btn" id="toggle-web" title="Full Desktop Webpage">
      <i class="fa-solid fa-laptop"></i> <span>Web View</span>
    </button>
  </div>
  
  <!-- Content Container -->
  <div class="profile-container" id="profile-container" style="display: none;">
    
    <!-- User Profile Details Card -->
    <div class="profile-card">
      <div class="avatar-container">
        <img id="avatar-img" src="" alt="Avatar" class="profile-avatar">
        <span class="avatar-verified" id="avatar-verified" style="display: none;"><i class="fa-solid fa-check"></i></span>
      </div>
      <h1 class="profile-name">
        <span id="display-name"></span>
        <i class="fa-solid fa-circle-check name-verified-badge" id="name-verified" style="display: none;"></i>
      </h1>
      <p class="profile-bio" id="bio-text"></p>
      
      <!-- Social Media Icons Row -->
      <div class="profile-socials" id="socials-row">
        <!-- Social buttons added via JS -->
      </div>
    </div>

    <!-- Active Link Buttons Stack -->
    <div class="links-stack" id="links-stack">
      <!-- Link buttons populated via JS -->
    </div>

    <!-- Contact Me Footer link -->
    <div style="text-align: center; margin-top: 1.5rem; margin-bottom: 0.5rem;">
      <a id="contact-footer" href="" class="contact-footer-link" style="display: none;">
        <i class="fa-solid fa-envelope"></i> Contact Me
      </a>
    </div>

    <!-- Powered by Badge / Brand Footer -->
    <div class="branding-footer">
      <a href="/" target="_blank" class="badge">✨ Get Your Own Page</a>
      <p>Powered by Build Your Link</p>
    </div>

  </div>

  <!-- Error / 404 message template inside page (if fetch fails) -->
  <div id="error-container" style="display:none; text-align:center; padding: 2rem;">
    <h2>Profile Not Found</h2>
    <p style="color: #a0aec0; margin: 1rem 0;">The link page you are trying to visit does not exist.</p>
    <a href="/" class="btn-action">Create Your Page</a>
  </div>

  <script src="/js/profile.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Build Your Link</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-wrapper">
  
  <div class="auth-card">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <a href="/" style="font-size: 1.8rem; font-weight: 800; background: linear-gradient(135deg, #a855f7 0%, #06b6d4 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">✨ Build Your Link</a>
    </div>
    
    <h2>Create Account</h2>
    <p class="subtitle">Secure your unique sharing handle today</p>

    <!-- Error container -->
    <div id="error-box" class="error-message"></div>

    <form id="register-form">
      <div class="form-group">
        <label for="username">Username (custom page URL)</label>
        <input type="text" id="username" placeholder="e.g. johndoe" required autocomplete="username" spellcheck="false">
        <p style="font-size: 0.8rem; color: #718096; margin-top: 0.25rem;">
          Your profile will be: <strong>localhost:3000/<span id="username-preview">yourname</span></strong>
        </p>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="At least 6 characters" required autocomplete="new-password">
      </div>

      <button type="submit" class="auth-btn" id="submit-btn">Create Free Page</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="/login.html">Log in here</a>
    </div>
  </div>

  <script>
    // Extract username query param (if redirected from landing page claim form)
    const urlParams = new URLSearchParams(window.location.search);
    const initialUsername = urlParams.get('username');
    
    const usernameInput = document.getElementById('username');
    const usernamePreview = document.getElementById('username-preview');

    if (initialUsername) {
      usernameInput.value = initialUsername.toLowerCase().replace(/[^a-z0-9_]/g, '');
      usernamePreview.textContent = usernameInput.value;
    }

    usernameInput.addEventListener('input', (e) => {
      const sanitizedVal = e.target.value.toLowerCase().replace(/[^a-z0-9_]/g, '');
      e.target.value = sanitizedVal;
      usernamePreview.textContent = sanitizedVal || 'yourname';
    });

    // If user is already logged in, redirect them to dashboard
    fetch('/api/auth/status')
      .then(res => res.json())
      .then(data => {
        if (data.loggedIn) {
          window.location.href = '/dashboard.html';
        }
      });

    // Handle Form Submit
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = usernameInput.value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorBox = document.getElementById('error-box');
      const submitBtn = document.getElementById('submit-btn');

      // Clear previous error
      errorBox.style.display = 'none';
      submitBtn.textContent = 'Creating...';
      submitBtn.disabled = true;

      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Registration failed.');
        }

        // Success - Go to dashboard
        window.location.href = '/dashboard.html';
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
        submitBtn.textContent = 'Create Free Page';
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
